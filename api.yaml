openapi: 3.0.3

info:
  title: Placement Cell Portal API
  description: >
    REST API for the Placement Cell Portal developed using Flask and Vue.js.
    The API supports authentication, student job applications, company job
    management, applicant tracking, and admin management.
  version: 1.0.0

servers:
  - url: http://localhost:5000
    description: Local development server

tags:
  - name: Authentication
  - name: Student
  - name: Company
  - name: Admin

paths:

  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate Admin, Company, or Student and generate a JWT access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid password
        '403':
          description: Account not approved or blacklisted
        '404':
          description: User not found

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Register a new Student or Company account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
                - role
              properties:
                username:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                role:
                  type: string
                  enum:
                    - Student
                    - Company
      responses:
        '201':
          description: Registration successful
        '400':
          description: Missing required fields
        '409':
          description: Username or email already registered

  /student/dashboard/explore-jobs:
    get:
      tags:
        - Student
      summary: Explore available jobs
      description: Return approved and ongoing placement drives available to the logged-in student.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Job listings returned successfully
        '404':
          description: Student profile not found

  /student/apply:
    post:
      tags:
        - Student
      summary: Apply for a placement drive
      description: Submit a job application for the logged-in student.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - job_id
              properties:
                job_id:
                  type: integer
      responses:
        '200':
          description: Application submitted successfully
        '400':
          description: Invalid application, duplicate application, missing resume, or eligibility failure
        '404':
          description: Student or job not found

  /student/dashboard/applied-history:
    get:
      tags:
        - Student
      summary: View application history
      description: Return all jobs applied to by the logged-in student with status, feedback, and interview information.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Application history returned successfully
        '404':
          description: Student profile not found

  /company/dashboard/manage-drives:
    get:
      tags:
        - Company
      summary: Manage placement drives
      description: Return all job postings created by the logged-in company.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Placement drives returned successfully
        '403':
          description: Company access denied

  /company/dashboard/applicants/table:
    get:
      tags:
        - Company
      summary: View applicants
      description: Return applicants for a selected placement drive.
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: query
          required: true
          schema:
            type: integer
          description: ID of the selected job position
      responses:
        '200':
          description: Applicant list returned successfully
        '403':
          description: Company access denied

  /company/dashboard/applicants/update-workflow:
    post:
      tags:
        - Company
      summary: Update applicant workflow
      description: Update application status, recruiter feedback, and interview schedule.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - application_id
                - status
              properties:
                application_id:
                  type: integer
                status:
                  type: string
                  enum:
                    - Pending
                    - Shortlist
                    - Selected
                    - Reject
                feedback:
                  type: string
                interview_time:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Applicant workflow updated successfully
        '400':
          description: Missing or invalid data
        '403':
          description: Company access denied
        '404':
          description: Application not found

  /admin/stats:
    get:
      tags:
        - Admin
      summary: Get dashboard statistics
      description: Return student, company, application, placement, and active drive statistics.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard statistics returned successfully
        '403':
          description: Unauthorized access

  /admin/companies/action:
    post:
      tags:
        - Admin
      summary: Manage company accounts
      description: Approve, reject, blacklist, activate, or remove a company.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - company_id
                - action
              properties:
                company_id:
                  type: integer
                action:
                  type: string
                  enum:
                    - Approve
                    - Reject
                    - Blacklist
                    - Activate
                    - Remove
      responses:
        '200':
          description: Company action completed successfully
        '400':
          description: Missing required fields
        '403':
          description: Unauthorized access
        '404':
          description: Company not found

  /admin/drives/action:
    post:
      tags:
        - Admin
      summary: Manage placement drives
      description: Approve, reject, or close a placement drive.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - job_id
                - action
              properties:
                job_id:
                  type: integer
                action:
                  type: string
                  enum:
                    - APPROVE
                    - REJECT
                    - CLOSE_APPLICATION
      responses:
        '200':
          description: Drive action completed successfully
        '403':
          description: Unauthorized access
        '404':
          description: Job position not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT